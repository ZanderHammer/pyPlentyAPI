[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plentymarkets-api-client"
version = "0.4.0"
description = "Async Python client for the PlentyMarkets REST API"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Alexander Hammer", email = "alexander@hmmr.online" },
]
keywords = ["plentymarkets", "rest-api", "async", "httpx", "ecommerce"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://codeberg.org/ZanderHammer/pyPlentyAPI"
Repository = "https://codeberg.org/ZanderHammer/pyPlentyAPI"
Issues = "https://codeberg.org/ZanderHammer/pyPlentyAPI/issues"
Changelog = "https://codeberg.org/ZanderHammer/pyPlentyAPI/src/branch/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "pytest-asyncio>=0.23",
    "commitizen>=3.29",
    "pre-commit>=3.7",
    "hatchling>=1.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/plentymarkets"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.4.0"
tag_format = "v$version"
version_files = ["pyproject.toml:version"]
pre_bump_hooks = ["python3 scripts/bump_changelog.py"]
major_version_zero = true
