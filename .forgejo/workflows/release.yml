name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish

      - name: Extract changelog entry
        id: changelog
        run: |
          python3 - "${{ steps.version.outputs.version }}" <<'EOF'
          import re
          import sys

          version = sys.argv[1]
          content = open("CHANGELOG.md").read()
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          entry = match.group(1).strip() if match else ""
          open("changelog_entry.md", "w").write(entry)
          EOF

      - name: Create release and upload artifacts
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          TAG="${{ steps.version.outputs.tag }}"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GITEA_TOKEN" \
            "https://codeberg.org/api/v1/repos/$REPO/releases/tags/$TAG")

          if [ "$STATUS" != "200" ]; then
            python3 -c "
import json
body = open('changelog_entry.md').read()
print(json.dumps({
    'tag_name': '$TAG',
    'target_commitish': '${{ github.sha }}',
    'name': '$TAG',
    'body': body,
    'draft': False,
    'prerelease': False,
}))
" > release_payload.json

            curl -X POST \
              -H "Authorization: token $GITEA_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @release_payload.json \
              "https://codeberg.org/api/v1/repos/$REPO/releases"
          fi

          RELEASE_ID=$(curl -s \
            -H "Authorization: token $GITEA_TOKEN" \
            "https://codeberg.org/api/v1/repos/$REPO/releases/tags/$TAG" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          for file in dist/*; do
            [ -f "$file" ] || continue
            curl -X POST \
              -H "Authorization: token $GITEA_TOKEN" \
              -F "attachment=@$file" \
              "https://codeberg.org/api/v1/repos/$REPO/releases/$RELEASE_ID/assets"
          done
